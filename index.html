    var dl = document.getElementById("drugList");
    var added = {};
    for (var i = 0; i < otcDrugs.length; i++) {
        var d = otcDrugs[i];
        var displayName = d.brand + " 【成分: " + d.name + "】";
        if (!added[displayName]) {
            var opt = document.createElement("option");
            opt.value = displayName;
            dl.appendChild(opt);
            added[displayName] = true;
        }
    }
};

function calculateCost() {
    var inputVal = document.getElementById("drugInput").value.trim();
    var ratio = parseFloat(document.getElementById("ratio").value);
    var isExempt = document.getElementById("exempt").checked;
    var resultDiv = document.getElementById("result");
    
    if (!inputVal) {
        alert("お薬の名前、またはキーワードを入力してください。");
        return;
    }

    resultDiv.style.display = "block";

    var foundDrug = null;
    for (var i = 0; i < otcDrugs.length; i++) {
        var d = otcDrugs[i];
        if (inputVal.indexOf(d.name) !== -1 || inputVal.indexOf(d.search) !== -1 || d.brand.indexOf(inputVal) !== -1) {
            foundDrug = d;
            break;
        }
    }

    var basePrice = 1000;

    if (foundDrug === null || isExempt) {
        var cost = Math.round(basePrice * ratio);
        var targetName = foundDrug ? foundDrug.brand : inputVal;
        
        resultDiv.className = "result-box alert-green";
        resultDiv.innerHTML = "<div class='result-title'>▼ 判定結果：これまで通り（通常負担）</div>" +
                              "お薬：<b>" + targetName + "</b><br>" +
                              "窓口支払額の目安：<b>" + cost + " 円</b><br>";
        
        if (isExempt && foundDrug) {
            resultDiv.innerHTML += "<p class='advice'>?? <b>Jemi-chan からの案内:</b><br>この薬は負担増の77成分に該当しますが、あなたが「免除対象」にチェックを入れているため、<b>特別料金は免除</b>されます。今まで通りの自己負担額で貰えるので、病院での処方がおトクです！</p>";
        } else {
            resultDiv.innerHTML += "<p class='advice'>?? <b>Jemi-chan からの案内:</b><br>このお薬は今回の負担増（77成分）の<b>対象外</b>、または市販されていない特別な薬です。これまで通りの保険負担のみですので、安心して病院で処方してもらってください。</p>";
        }
    } 
    else {
        var specialPart = basePrice * 0.25;  
        var specialTax = specialPart * 0.10;  
        var insurancePart = basePrice * 0.75; 
        
        var userPaySpecial = specialPart + specialTax; 
        var userPayInsurance = insurancePart * ratio; 
        
        var totalCost = Math.round(userPaySpecial + userPayInsurance);
        var normalCost = Math.round(basePrice * ratio);
        var diff = totalCost - normalCost;

        var keyword = foundDrug.brand.split("（")[0];
        
        var matskiyourl = "https://www.matsukiyo.co.jp/store/online/search?text=" + encodeURIComponent(keyword);
        var welciaUrl = "https://www.google.com/search?q=" + encodeURIComponent(keyword + " ウエルシアドットコム 市販薬");
        var aokiUrl = "https://www.google.com/search?q=" + encodeURIComponent(keyword + " クスリのアオキ ネットショップ");

        resultDiv.className = "result-box alert-orange";
        resultDiv.innerHTML = "<div class='result-title'>▼ 判定結果：自己負担アップ対象です！</div>" +
                              "お薬：<span class='accent'>" + foundDrug.brand + "</span><br>" +
                              "成分名：<b>" + foundDrug.name + "</b><br><br>" +
                              "新しい窓口支払額の目安：<b>" + totalCost + " 円</b><br>" +
                              "<small>（従来より約 <span class='accent'>" + diff + " 円</span> 負担が増えます）</small>" +
                              "<p class='advice'>?? <b>Jemi-chan のおトク極意：</b><br>" +
                              "このお薬はドラッグストアでも全く同じ成分の市販薬（OTC）が買えます！<br>" +
                              "病院の諸経費と天秤にかけて、ネットショップで実際の市販薬の価格をチェックしてみましょう！</p>" +
                              
                              "<div class='shop-link-title'>?? 各ショップで市販薬の価格を調べる：</div>" +
                              "<div class='shop-btn-container'>" +
                              "  <a href='" + matskiyourl + "' target='_blank' class='shop-btn btn-matsukiyo'>マツキヨ店</a>" +
                              "  <a href='" + welciaUrl + "' target='_blank' class='shop-btn btn-welcia'>ウエルシアで検索</a>" +
                              "  <a href='" + aokiUrl + "' target='_blank' class='shop-btn btn-aoki'>アオキを検索</a>" +
                              "</div>";
    }
}

function clearForm() {
    document.getElementById("drugInput").value = "";  
    document.getElementById("ratio").selectedIndex = 0; 
    document.getElementById("exempt").checked = false;  
    
    var resultDiv = document.getElementById("result");
    resultDiv.innerHTML = "";                         
    resultDiv.style.display = "none";                  
}
</script>
